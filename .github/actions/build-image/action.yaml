name: Build emulator image
description: >
  Build the multi-arch (amd64 + arm64) image for one emulator version. Check
  out the repository first. Never pushes: with `archive` set, the image (with
  SBOM and provenance attached) is saved there as an OCI archive for the
  calling job to push.

inputs:
  emulator-version:
    description: Emulator version (MAJOR.MINOR.PATCH)
    required: true
  sha256-amd64:
    description: Expected SHA-256 of the amd64 .deb
    required: true
  sha256-arm64:
    description: Expected SHA-256 of the arm64 .deb
    required: true
  use-cache:
    description: >
      Read and write the GitHub Actions build cache. Must be "false" for
      release builds, so a poisoned cache entry can't reach a published image.
    default: "true"
  archive:
    description: Path to save the image as an OCI archive (empty = don't save)
    default: ""

runs:
  using: composite
  steps:
    # Both setup actions fetch tools at run time; pin what they fetch, not
    # just the actions (defaults: binfmt:latest, newest buildx, and a floating
    # buildkit image).
    - name: Set up QEMU for arm64
      id: setup-qemu
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
        cache-image: false   # no tool caching in the Actions cache (poisoning)

    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        cache-binary: false  # no tool caching in the Actions cache (poisoning)
        driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

    - name: Generate image labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        labels: |
          org.opencontainers.image.version=${{ inputs.emulator-version }}

    - name: Build image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: |
          EMULATOR_VERSION=${{ inputs.emulator-version }}
          EMULATOR_SHA256_AMD64=${{ inputs.sha256-amd64 }}
          EMULATOR_SHA256_ARM64=${{ inputs.sha256-arm64 }}
        labels: ${{ steps.meta.outputs.labels }}
        push: false
        # Untagged on purpose: the caller decides tags at push time.
        outputs: ${{ inputs.archive != '' && format('type=oci,dest={0}', inputs.archive) || '' }}
        provenance: ${{ inputs.archive != '' && 'mode=max' || 'false' }}
        sbom: ${{ inputs.archive != '' }}
        cache-from: ${{ inputs.use-cache == 'true' && format('type=gha,scope=emu-{0}', inputs.emulator-version) || '' }}
        cache-to: ${{ inputs.use-cache == 'true' && format('type=gha,mode=max,scope=emu-{0}', inputs.emulator-version) || '' }}
